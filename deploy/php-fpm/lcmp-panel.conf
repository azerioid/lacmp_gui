; LCMP Panel dedicated PHP-FPM pool (example; install.sh generates the live file).
; Isolated from www.conf. shell_exec / system / exec stay disabled.
; Do not add proc_open to disable_functions here.

[lcmp-panel]
user = caddy
group = caddy
listen = /run/php/lcmp-panel.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 200

php_admin_value[disable_functions] = passthru,exec,shell_exec,system,chroot,chgrp,chown,ini_alter,ini_restore
php_admin_flag[expose_php] = off
php_admin_value[open_basedir] = /usr/local/lib/lcmp-panel/web:/tmp:/dev/urandom:/usr/bin/sudo:/var/log/lcmp-panel
php_admin_value[session.save_path] = /usr/local/lib/lcmp-panel/web/storage/framework/sessions
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/lcmp-panel/php-fpm.log
