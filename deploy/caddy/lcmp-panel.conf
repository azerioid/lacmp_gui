# LCMP Panel — localhost-only vhost (example; install.sh generates the live file).
#
# Installed by: ./lcmp_gui.sh --install-caddy-snippet
# Access: ssh -L 6969:127.0.0.1:6969 <host>  then  http://127.0.0.1:6969
#
# Bind is 127.0.0.1 only — never 0.0.0.0:6969. Does not touch projob.az.

http://127.0.0.1:6969 {
    bind 127.0.0.1
    encode gzip zstd
    root * /usr/local/lib/lcmp-panel/web/public
    php_fastcgi unix//run/php/lcmp-panel.sock
    file_server
    header {
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        Referrer-Policy no-referrer
    }
    log {
        output file /var/log/caddy/access_lcmp-panel.log {
            roll_size 16mb
            roll_keep 3
            roll_keep_for 7d
        }
    }
}
