# LCMP Panel — localhost-only vhost (generated example).
#
# Default install: ./lcmp_gui.sh
# Access: ssh -L 6969:127.0.0.1:6969 <host>  then  http://127.0.0.1:6969
#
# Bind is 127.0.0.1 only. Public HTTPS is a separate site block (see
# lcmp-panel.public-ip.conf.example / lcmp-panel.public-domain.conf.example).

http://127.0.0.1:6969 {
    bind 127.0.0.1
    encode gzip zstd
    root * /usr/local/lib/lcmp-panel/web/public
    php_fastcgi unix//run/php/lcmp-panel.sock
    file_server
    header {
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        Referrer-Policy no-referrer
        -Server
    }
    log {
        output file /var/log/caddy/access_lcmp-panel.log {
            roll_size 16mb
            roll_keep 3
            roll_keep_for 7d
        }
    }
}
