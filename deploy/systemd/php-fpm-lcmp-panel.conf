# Installed by deploy/install.sh as:
#   /etc/systemd/system/<phpX.Y-fpm.service>.d/lcmp-panel.conf
#
# ProtectSystem=full remounts /usr read-only in the FPM namespace, so Blade
# compile under PREFIX/web/storage needs a punch-hole. Web-server config
# (/etc/caddy, /etc/apache2, /etc/httpd) is written by the systemd-run broker
# in a fresh namespace — do not list those dirs here. A missing ReadWritePaths
# entry makes systemd fail the unit with 226/NAMESPACE.
#
# install.sh writes only paths that exist. Example (LCMP or LAMP):

[Service]
ReadWritePaths=/usr/local/lib/lcmp-panel/web/storage /usr/local/lib/lcmp-panel/web/bootstrap/cache /var/log/lcmp-panel
