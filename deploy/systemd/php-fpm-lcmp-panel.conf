# Installed by deploy/install.sh as:
#   /etc/systemd/system/<phpX.Y-fpm.service>.d/lcmp-panel.conf
#
# ProtectSystem=full remounts /etc read-only in the FPM namespace. sudo does
# not escape that mount ns, so a root broker inherited from FPM gets EROFS on
# /etc/caddy. The broker wrapper prefers systemd-run (fresh namespace). These
# ReadWritePaths are the fallback so the same writes succeed in-namespace.
# DAC stays root-owned: the unprivileged pool user still gets EACCES.
#
# Paths below are examples; install.sh substitutes PREFIX and WWW_ROOT.

[Service]
ReadWritePaths=/usr/local/lib/lcmp-panel/web/storage /usr/local/lib/lcmp-panel/web/bootstrap/cache /var/log/lcmp-panel /etc/caddy /etc/lcmp-panel /var/log/caddy /var/lib/lcmp-panel /data/www
